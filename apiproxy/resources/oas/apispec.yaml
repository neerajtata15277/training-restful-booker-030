openapi: 3.0.2

info:
  version: v1
  title: training-restful-booker-030
  description: Description for restful-booker-api

servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/sidgs-867/training-restful-booker-030/v1
  - description: Restful Booker API
    url: https://restful-booker.herokuapp.com

tags:
  - name: Booking
    description: Booking management operations

paths:

  /booking:

    get:
      tags:
        - Booking
      summary: GetBookingIds
      description: Returns the IDs of all bookings or a filtered subset.
      operationId: getBookingIds

      parameters:
        - name: firstname
          in: query
          required: false
          schema:
            type: string
          example: sally

        - name: lastname
          in: query
          required: false
          schema:
            type: string
          example: brown

        - name: checkin
          in: query
          required: false
          description: Returns bookings with checkin dates greater than or equal to the specified date.
          schema:
            type: string
            format: date
          example: "2014-03-13"

        - name: checkout
          in: query
          required: false
          description: Returns bookings with checkout dates greater than or equal to the specified date.
          schema:
            type: string
            format: date
          example: "2014-05-21"

      responses:
        "200":
          description: Booking IDs retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookingid:
                      type: integer
              examples:
                allBookings:
                  summary: Example 1 - All booking IDs
                  value:
                    - bookingid: 4308
                    - bookingid: 4309
                    - bookingid: 4311

                filterByName:
                  summary: Example 2 - Filter by name
                  value:
                    - bookingid: 4308

                filterByDates:
                  summary: Example 3 - Filter by dates
                  value:
                    - bookingid: 4308
                    - bookingid: 4311

                noBookingsFound:
                  summary: No bookings found
                  value: []

        "400":
          description: Invalid query parameters.
          content:
            application/json:
              example:
                error: Invalid query parameters

    post:
      tags:
        - Booking
      summary: CreateBooking
      description: Creates a new booking in the API.
      operationId: createBooking

      parameters:
        - name: Content-Type
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/json
              - text/xml
            default: application/json
          description: Format of request payload.

        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/xml
            default: application/json
          description: Format of response body.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            examples:
              example1:
                $ref: '#/components/examples/Booking'

          text/xml:
            schema:
              type: string

          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'

      responses:
        "200":
          description: Booking created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                example1:
                  $ref: '#/components/examples/BookingResponse'

        "400":
          description: Bad request - invalid booking details.

  /booking/{id}:

    get:
      tags:
        - Booking
      summary: GetBooking
      description: Returns a specific booking based upon the booking ID provided.
      operationId: getBooking

      parameters:
        - $ref: '#/components/parameters/BookingId'

        - name: Accept
          in: header
          required: false
          description: Sets the response format.
          schema:
            type: string
            enum:
              - application/json
              - application/xml
            default: application/json

      responses:
        "200":
          description: Booking retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example1:
                  $ref: '#/components/examples/Booking'

            application/xml:
              schema:
                type: string

        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                type: string
              example: The required details are not found

    put:
      tags:
        - Booking
      summary: UpdateBooking
      description: Updates an existing booking.
      operationId: updateBooking

      parameters:
        - $ref: '#/components/parameters/BookingId'

        - name: Content-Type
          in: header
          required: false
          schema:
            type: string
            default: application/json

        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            examples:
              example1:
                $ref: '#/components/examples/UpdatedBooking'

          text/xml:
            schema:
              type: string

          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'

      responses:
        "200":
          description: Booking updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example1:
                  $ref: '#/components/examples/UpdatedBooking'

        "400":
          description: Bad request - invalid booking details.

        "403":
          description: Forbidden.

        "404":
          description: Booking not found.

    delete:
      tags:
        - Booking
      summary: DeleteBooking
      description: Deletes an existing booking.
      operationId: deleteBooking

      parameters:
        - $ref: '#/components/parameters/BookingId'

      responses:
        "204":
          description: Booking deleted successfully.
          content:
            text/plain:
              schema:
                type: string
              example: deleted

        "403":
          description: Forbidden.

        "405":
          description: Method not allowed.

components:

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      description: ID of the booking.
      schema:
        type: integer
      example: 1

  schemas:

    Booking:
      type: object
      required:
        - firstname
        - lastname
        - totalprice
        - depositpaid
        - bookingdates
      properties:
        firstname:
          type: string
          description: Firstname for the guest who made the booking.
          example: Jim

        lastname:
          type: string
          description: Lastname for the guest who made the booking.
          example: Brown

        totalprice:
          type: number
          description: Total price for the booking.
          example: 111

        depositpaid:
          type: boolean
          description: Whether the deposit has been paid or not.
          example: true

        bookingdates:
          $ref: '#/components/schemas/BookingDates'

        additionalneeds:
          type: string
          description: Any other needs the guest has.
          example: Breakfast

    BookingDates:
      type: object
      required:
        - checkin
        - checkout
      properties:
        checkin:
          type: string
          format: date
          description: Date the guest is checking in.
          example: "2018-01-01"

        checkout:
          type: string
          format: date
          description: Date the guest is checking out.
          example: "2019-01-01"

    BookingResponse:
      type: object
      properties:
        bookingid:
          type: integer
          description: ID for newly created booking.
          example: 1

        booking:
          $ref: '#/components/schemas/Booking'

  examples:

    Booking:
      value:
        firstname: Jim
        lastname: Brown
        totalprice: 111
        depositpaid: true
        bookingdates:
          checkin: "2018-01-01"
          checkout: "2019-01-01"
        additionalneeds: Breakfast

    UpdatedBooking:
      value:
        firstname: James
        lastname: Brown
        totalprice: 111
        depositpaid: true
        bookingdates:
          checkin: "2018-01-01"
          checkout: "2019-01-01"
        additionalneeds: Breakfast

    BookingResponse:
      value:
        bookingid: 1
        booking:
          firstname: Jim
          lastname: Brown
          totalprice: 111
          depositpaid: true
          bookingdates:
            checkin: "2018-01-01"
            checkout: "2019-01-01"
          additionalneeds: Breakfast